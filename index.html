            }
          }
        ]
      };
    }

    // Load or initialize state
    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {
        console.warn('State load fallback:', e);
      }
      return getInitialData();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('State save error:', e);
      }
      updateNavigationUI();
    }

    function resetDemoData() {
      state = getInitialData();
      saveState();
      closeModal();
      renderApp();
      showToast('デモデータを初期状態にリセットしました', 'info');
    }

    // ============================================================================
    // UTILITY FUNCTIONS
    // ============================================================================
    function formatJPY(amount) {
      return '¥' + Number(amount).toLocaleString('ja-JP');
    }

    function getFeeRate() {
      return state.currentUserClient.plan === 'enterprise' ? 0.10 : 0.15;
    }

    function calculateFees(reward) {
      const rate = getFeeRate();
      const fee = Math.round(reward * rate);
      const clientTotal = reward + fee;
      return {
        reward,
        feeRatePercent: Math.round(rate * 100),
        platformFee: fee,
        clientTotal
      };
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-slate-900 text-white border-slate-700',
        info: 'bg-brand-600 text-white border-brand-500',
        warning: 'bg-amber-600 text-white border-amber-500'
      };
      const icons = {
        success: `<svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`,
        info: `<svg class="w-4 h-4 text-white shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
        warning: `<svg class="w-4 h-4 text-amber-200 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`
      };
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-elevated text-sm font-medium animate-fade-in ${colors[type] || colors.success}`;
      toast.innerHTML = `${icons[type] || icons.success}<span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 3400);
    }

    // ============================================================================
    // NAVIGATION & ROLE SWITCHING
    // ============================================================================
    function navigateTo(view, subTab = null) {
      state.currentView = view;
      if (subTab) {
        state.workspaceTab = subTab;
      }
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchRole(role) {
      if (state.currentRole === role) return;
      state.currentRole = role;
      state.workspaceTab = role === 'worker' ? 'active' : 'open_applicants';
      saveState();
      renderApp();
      const label = role === 'worker'
        ? `ワーカー視点（${state.currentUserWorker.name}）に切り替えました`
        : `依頼者視点（${state.currentUserClient.companyName}）に切り替えました`;
      showToast(label, 'info');
    }

    function updateNavigationUI() {
      // Role buttons
      const workerBtn = document.getElementById('role-btn-worker');
      const clientBtn = document.getElementById('role-btn-client');
      if (state.currentRole === 'worker') {
        workerBtn.className = 'flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-subtle transition-all';
        clientBtn.className = 'flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-800 transition-all';
      } else {
        clientBtn.className = 'flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-900 shadow-subtle transition-all';
        workerBtn.className = 'flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:text-slate-800 transition-all';
      }

      // Active Persona Badge
      const personaBadge = document.getElementById('active-persona-badge');
      if (state.currentRole === 'worker') {
        personaBadge.innerHTML = `

          <span class="text-amber-500 font-semibold tabular-nums">★${state.currentUserWorker.rating}</span>
        `;
      } else {
        personaBadge.innerHTML = `
          <span class="w-5 h-5 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-[11px]">${state.currentUserClient.avatar}</span>
          <span class="font-semibold text-slate-800">${escapeHTML(state.currentUserClient.companyName)}</span>
        `;
      }

      // Role Context Banner
      const bannerText = document.getElementById('role-banner-text');
      if (state.currentRole === 'worker') {
        bannerText.innerHTML = `
          <span class="inline-flex items-center px-2 py-0.5 rounded-md font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/80">ワーカーモード</span>
          <span>現在 <strong>${escapeHTML(state.currentUserWorker.name)}</strong> としてログイン中 — 募集中の仕事への応募・チャット・成果物提出が可能です。</span>
        `;
      } else {
        bannerText.innerHTML = `
          <span class="inline-flex items-center px-2 py-0.5 rounded-md font-semibold bg-brand-50 text-brand-700 border border-brand-200/80">依頼者（企業）モード</span>
          <span>現在 <strong>${escapeHTML(state.currentUserClient.companyName)}</strong> としてログイン中 — 新規案件の掲載・応募者の即時確定・検収が可能です。</span>
        `;
      }

      // Active Nav Highlighting
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === state.currentView) {
          btn.classList.add('bg-slate-100', 'text-slate-900', 'font-semibold');
          btn.classList.remove('text-slate-600', 'hover:bg-slate-50');
        } else {
          btn.classList.remove('bg-slate-100', 'text-slate-900', 'font-semibold');
          btn.classList.add('text-slate-600', 'hover:bg-slate-50');
        }
      });

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === state.currentView) {
          btn.classList.add('text-brand-600', 'bg-brand-50/70');
          btn.classList.remove('text-slate-500');
        } else {
          btn.classList.remove('text-brand-600', 'bg-brand-50/70');
          btn.classList.add('text-slate-500');
        }
      });

      // Notification Counter (Active tasks or pending applicants)
      let actionableCount = 0;
      if (state.currentRole === 'worker') {
        actionableCount = state.jobs.filter(j => j.assignedWorkerId === state.currentUserWorker.id && (j.status === 'matched' || j.status === 'submitted')).length;
      } else {
        actionableCount = state.jobs.filter(j => j.clientId === state.currentUserClient.id && (
          (j.status === 'open' && j.applicants.length > 0) || j.status === 'submitted' || j.status === 'matched'
        )).length;
      }

      const navBadge = document.getElementById('nav-badge');
      const mobileBadge = document.getElementById('mobile-nav-badge');
      if (actionableCount > 0) {
        navBadge.textContent = actionableCount;
        navBadge.classList.remove('hidden');
        mobileBadge.textContent = actionableCount;
        mobileBadge.classList.remove('hidden');
      } else {
        navBadge.classList.add('hidden');
        mobileBadge.classList.add('hidden');
      }
    }

    // ============================================================================
    // MAIN VIEW ROUTER
    // ============================================================================
    function renderApp() {
      updateNavigationUI();
      const main = document.getElementById('app-main');
      if (state.currentView === 'discover') {
        main.innerHTML = renderDiscoverView();
      } else if (state.currentView === 'post') {
        main.innerHTML = renderPostJobView();
        updatePostCalculator();
      } else if (state.currentView === 'workspace') {
        main.innerHTML = renderWorkspaceView();
      }
    }

    // ============================================================================
    // VIEW 1: DISCOVER JOBS (トップページ & 仕事を探す)
    // ============================================================================
    function renderDiscoverView() {
      const openJobsCount = state.jobs.filter(j => j.status === 'open').length;

      // Filter & Sort logic
      let filtered = state.jobs.filter(job => {
        // Show open jobs primarily, plus let users see matched ones if no filter hides them, or focus on open jobs
        if (job.status === 'completed') return false;
        if (state.filters.category !== 'すべて' && job.category !== state.filters.category) return false;
        if (state.filters.duration !== 'すべて' && job.durationHours !== Number(state.filters.duration)) return false;
        if (state.filters.minReward > 0 && job.reward < Number(state.filters.minReward)) return false;
        if (state.filters.search.trim() !== '') {
          const q = state.filters.search.toLowerCase();
          const inTitle = job.title.toLowerCase().includes(q);
          const inDesc = job.description.toLowerCase().includes(q);
          const inSkills = job.skills.some(s => s.toLowerCase().includes(q));
          const inClient = job.clientName.toLowerCase().includes(q);
          if (!inTitle && !inDesc && !inSkills && !inClient) return false;
        }
        return true;
      });

      // Sort
      filtered.sort((a, b) => {
        if (state.filters.sort === 'reward_desc') return b.reward - a.reward;
        if (state.filters.sort === 'urgent') return (a.urgency === 'urgent' ? -1 : 1) - (b.urgency === 'urgent' ? -1 : 1);
        return b.createdAt - a.createdAt;
      });

      return `

                <span>選考なし・履歴書不要の1〜3時間スポット業務マッチング</span>
              </div>
              <h1 class="font-display text-2xl sm:text-4xl font-bold tracking-tight text-slate-900 leading-tight">
                今すぐ1時間だけ、<br class="sm:hidden" />仕事を頼む・働く。

              <!-- Primary CTA Buttons -->

                <a href="#job-listings" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold shadow-subtle transition-all">
                  <span>募集中の仕事を見る</span>
                  <span class="px-2 py-0.5 rounded-full bg-white/15 text-xs tabular-nums">${openJobsCount}件</span>
                </a>
                <button onclick="switchRoleAndPost()" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 text-sm font-semibold shadow-subtle transition-all">
                  <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                  </svg>
                  <span>1時間から仕事を依頼する</span>
                </button>
              </div>
            </div>

            <!-- Key Platform Metrics Strip -->
            <div class="mt-8 pt-6 border-t border-slate-100 grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
              <div>
                <div class="text-xs font-medium text-slate-500">現在募集中のスポット案件</div>
                <div class="mt-1 font-display text-xl sm:text-2xl font-bold text-slate-900 tabular-nums">${openJobsCount} <span class="text-xs font-normal text-slate-500">件</span></div>
              </div>
              <div>
                <div class="text-xs font-medium text-slate-500">平均マッチング成立時間</div>
                <div class="mt-1 font-display text-xl sm:text-2xl font-bold text-emerald-600 tabular-nums">8 <span class="text-xs font-normal text-slate-500">分</span></div>
              </div>
              <div>
                <div class="text-xs font-medium text-slate-500">想定作業時間レンジ</div>
                <div class="mt-1 font-display text-xl sm:text-2xl font-bold text-slate-900 tabular-nums">1〜3 <span class="text-xs font-normal text-slate-500">時間完結</span></div>
              </div>
              <div>
                <div class="text-xs font-medium text-slate-500">ワーカー手数料</div>
                <div class="mt-1 font-display text-xl sm:text-2xl font-bold text-brand-600 tabular-nums">0 <span class="text-xs font-normal text-slate-500">円（報酬100%受取）</span></div>
              </div>
            </div>

          <!-- Search & Filter Controls -->
          <section id="job-listings" class="space-y-4">

                <div class="flex items-center gap-2">
                  <select onchange="updateFilter('duration', this.value)" class="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 font-medium focus:outline-none focus:border-brand-600">
                    <option value="すべて" ${state.filters.duration === 'すべて' ? 'selected' : ''}>作業時間：すべて</option>
                    <option value="1" ${state.filters.duration === '1' ? 'selected' : ''}>1時間のみ</option>
                    <option value="2" ${state.filters.duration === '2' ? 'selected' : ''}>2時間のみ</option>
                    <option value="3" ${state.filters.duration === '3' ? 'selected' : ''}>3時間のみ</option>
                  </select>
                  <select onchange="updateFilter('minReward', this.value)" class="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 font-medium focus:outline-none focus:border-brand-600">
                    <option value="0" ${Number(state.filters.minReward) === 0 ? 'selected' : ''}>報酬：指定なし</option>
                    <option value="2500" ${Number(state.filters.minReward) === 2500 ? 'selected' : ''}>¥2,500以上</option>
                    <option value="3000" ${Number(state.filters.minReward) === 3000 ? 'selected' : ''}>¥3,000以上</option>
                    <option value="5000" ${Number(state.filters.minReward) === 5000 ? 'selected' : ''}>¥5,000以上</option>
                  </select>
                  <select onchange="updateFilter('sort', this.value)" class="hidden sm:block px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 font-medium focus:outline-none focus:border-brand-600">
                    <option value="newest" ${state.filters.sort === 'newest' ? 'selected' : ''}>新着順</option>
                    <option value="reward_desc" ${state.filters.sort === 'reward_desc' ? 'selected' : ''}>報酬が高い順</option>

                      class="shrink-0 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all border ${

                      ${cat}

                  `;

            </div>

            <!-- Results Header -->
            <div class="flex items-center justify-between px-1">
              <h2 class="text-sm font-semibold text-slate-800">
                該当するスポット業務 <span class="ml-1 text-brand-600 tabular-nums">${filtered.length}件</span>
              </h2>
              ${(state.filters.search || state.filters.category !== 'すべて' || state.filters.duration !== 'すべて' || Number(state.filters.minReward) > 0) ? `
                <button onclick="clearFilters()" class="text-xs font-medium text-slate-500 hover:text-slate-800 underline">
                  絞り込みをクリア
                </button>

            <!-- Job Cards Grid -->
            ${filtered.length === 0 ? `
              <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center">
                <p class="text-sm font-semibold text-slate-800">条件に一致する仕事が見つかりませんでした</p>
                <p class="mt-1 text-xs text-slate-500">検索キーワードや絞り込み条件を変更してお試しください。</p>

    function renderJobCard(job) {
      const hourlyRate = Math.round(job.reward / job.durationHours);
      const isApplied = job.applicants.some(a => a.workerId === state.currentUserWorker.id);
      const isMatched = job.status !== 'open';

      return `
        <article
          onclick="openJobDetailModal('${job.id}')"
          class="group bg-white rounded-2xl border border-slate-200 hover:border-brand-500/60 p-5 shadow-card hover:shadow-elevated transition-all cursor-pointer flex flex-col justify-between"
        >
          <div>

            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-1.5">
                ${isMatched ? `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-600 border border-slate-200">
                    募集終了（マッチング済）
                  </span>
                ` : job.urgency === 'urgent' ? `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">

                    急募・本日締切

                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    募集中
                  </span>
                `}
                <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-50 text-slate-600 border border-slate-200/70">
                  ${escapeHTML(job.category)}
                </span>
              </div>
              ${isApplied && !isMatched ? `
                <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-brand-50 text-brand-700 border border-brand-200">応募済み</span>
              ` : ''}
            </div>

            <!-- Job Title -->
            <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition-colors leading-snug line-clamp-2">
              ${escapeHTML(job.title)}

    function applyToJob(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;

      // Duplicate & Status validation
      if (job.status !== 'open') {
        showToast('この案件はすでに募集終了しています', 'warning');
        return;
      }
      if (job.applicants.some(a => a.workerId === state.currentUserWorker.id)) {
        showToast('すでにこの仕事に応募済みです', 'warning');
        return;
      }

      const msgInput = document.getElementById('apply-message-input');
      const message = msgInput ? msgInput.value.trim() : '今すぐ着手可能です。よろしくお願いいたします。';

      job.applicants.unshift({
        id: 'app_' + Date.now(),
        workerId: state.currentUserWorker.id,
        workerName: state.currentUserWorker.name,
        workerTitle: state.currentUserWorker.title,
        rating: state.currentUserWorker.rating,
        completedCount: state.currentUserWorker.completedCount,
        skills: [...state.currentUserWorker.skills],
        message: message || '今すぐ対応可能です。よろしくお願いいたします。',
        appliedAt: 'たった今'
      });

      saveState();
      openJobDetailModal(jobId);
      renderApp();
      showToast('仕事への応募が完了しました！', 'success');
    }

    function setPostDuration(hours) {
      postFormState.durationHours = hours;
      [1, 2, 3].forEach(h => {
        const btn = document.getElementById(`dur-btn-${h}`);
        if (!btn) return;
        if (h === hours) {
          btn.className = 'p-3.5 rounded-xl border text-left transition-all border-brand-600 bg-brand-50/60 ring-2 ring-brand-600/15';
        } else {
          btn.className = 'p-3.5 rounded-xl border text-left transition-all border-slate-200 hover:border-slate-300 bg-white';
        }
      });
      updatePostCalculator();
    }

    function setPostReward(amount) {
      postFormState.reward = amount;
      const input = document.getElementById('post-reward');
      if (input) input.value = amount;
      updatePostCalculator();
    }

    function togglePostSkill(skill) {
      const idx = postFormState.selectedSkills.indexOf(skill);
      if (idx >= 0) {
        postFormState.selectedSkills.splice(idx, 1);
      } else {
        postFormState.selectedSkills.push(skill);
      }
      const container = document.getElementById('post-skills-container');
      if (container) {
        container.innerHTML = POPULAR_SKILLS.map(s => {
          const selected = postFormState.selectedSkills.includes(s);
          return `
            <button
              type="button"
              onclick="togglePostSkill('${s}')"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${
                selected
                  ? 'bg-slate-900 text-white border-slate-900'
                  : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
              }"
            >
              ${selected ? '✓ ' : '+ '}${s}
            </button>
          `;
        }).join('');
      }
    }

      if (input.files && input.files[0]) {

    // ============================================================================
    // INSTANT MATCHING LOGIC (マッチング確定・募集終了ロック)
    // ============================================================================
    function confirmMatch(jobId, applicantId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;

      // Prevent duplicate assignment
      if (job.status !== 'open') {
        showToast('この仕事はすでに他のワーカーとマッチング済みです', 'warning');
        return;
      }

      const applicant = job.applicants.find(a => a.id === applicantId);
      if (!applicant) return;

      // Lock job & assign worker
      job.status = 'matched';
      job.assignedWorkerId = applicant.workerId;
      job.assignedWorkerName = applicant.workerName;

      // Add system welcome message in transaction room
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      job.messages.push({
        id: 'msg_sys_' + Date.now(),
        senderRole: 'system',
        senderName: 'SPOT1 システム',
        text: `マッチングが成立しました！${applicant.workerName}さんが業務を開始できます。このチャットで詳細確認・成果物の提出を行ってください。`,
        time: timeStr,
        attachment: null
      });

      state.workspaceTab = 'in_progress';
      state.activeTransactionJobId = job.id;
      saveState();
      renderApp();
      showToast(`${applicant.workerName}さんとのマッチングが成立しました！`, 'success');
    }

    function selectTransactionJob(jobId) {
      state.activeTransactionJobId = jobId;
      saveState();
      renderApp();
    }

    function appendChatMessage(jobId, text, attachmentName = null) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job || (!text && !attachmentName)) return;

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const senderName = state.currentRole === 'worker'
        ? state.currentUserWorker.name
        : `${state.currentUserClient.companyName}`;

      job.messages.push({
        id: 'msg_' + Date.now(),
        senderRole: state.currentRole,
        senderName,
        text: text || 'ファイルを送信しました',
        time: timeStr,
        attachment: attachmentName
      });

      saveState();
      renderApp();
      const feed = document.getElementById('chat-messages-feed');
      if (feed) feed.scrollTop = feed.scrollHeight;
    }

    function handleChatSubmit(e, jobId) {
      e.preventDefault();
      const input = document.getElementById(`chat-input-${jobId}`);
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      appendChatMessage(jobId, text);
    }

    function sendQuickChat(jobId, text) {
      appendChatMessage(jobId, text);
    }

    function sendFileInChat(jobId, fileInput) {
      if (fileInput.files && fileInput.files[0]) {
        appendChatMessage(jobId, '資料ファイルを共有します。', fileInput.files[0].name);
        showToast('ファイルをチャットに送信しました', 'success');
      }
    }

    // --- DELIVERABLE SUBMISSION & APPROVAL ---
    function submitDeliverable(e, jobId) {
      e.preventDefault();
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;

      const fileName = document.getElementById(`deliverable-file-${jobId}`).value.trim();
      const comment = document.getElementById(`deliverable-comment-${jobId}`).value.trim();
      const now = new Date();
      const timeStr = `本日 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      job.status = 'submitted';
      job.deliverableSubmission = {
        fileName,
        comment,
        submittedAt: timeStr,
        approvedAt: null
      };

      appendChatMessage(jobId, `【成果物提出】${comment}`, fileName);
      showToast('成果物を提出しました！依頼者の検収をお待ちください。', 'success');
    }

    function requestRevision(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      job.status = 'matched';
      appendChatMessage(jobId, '【修正依頼】ご提出ありがとうございます！1点微修正をお願いしたく、詳細を確認させてください。');
      showToast('ワーカーへ修正依頼を送信しました', 'info');
    }

    function approveDeliverable(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;

      const now = new Date();
      const timeStr = `本日 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      job.status = 'completed';
      if (job.deliverableSubmission) {
        job.deliverableSubmission.approvedAt = timeStr;
      }

      job.messages.push({
        id: 'msg_complete_' + Date.now(),
        senderRole: 'system',
        senderName: 'SPOT1 システム',
        text: `検収が完了し、取引が終了しました。ワーカー報酬（${formatJPY(job.reward)}）が確定しました。`,
        time: timeStr,
        attachment: null
      });

      state.workspaceTab = 'completed';
      saveState();
      renderApp();
      showToast('検収完了！報酬の確定処理が完了しました。', 'success');
    }
